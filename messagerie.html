<!DOCTYPE html>
<html>

<head>
    <title>Messagerie - GOHUNT</title>

    <link rel="stylesheet" href="messsagerie.css">
</head>

<body> 
    <!-- BARRE DE NAVIGATION -->

    <div class="menu">

        <h1 class="logo">GOHUNT</h1>

        <a href="accueil.html">Accueil</a>

        <a href="messagerie.html">Messagerie</a>

        <a href="membres.html">Membres</a>

        <a href="profil.html">Profil</a>

    </div>
    <!-- CONTENU PRINCIPAL -->

    <div class="contenu">
        <!-- LISTE DES CONVERSATIONS -->

        <div class="conversations">

            <h2>Conversations</h2>

            <input
                class="recherche"
                type="text"
                placeholder="Rechercher une conversation"
            >
            <!-- KAROL -->

            <div class="conversation conversation-active">

                <strong>Karol Ihano</strong>

                <span class="en-ligne">●</span>

                <p>
                    Ça va ?
                </p>

            </div>
            <!-- MATHIAS -->

            <div class="conversation">

                <strong>Mathias SOKPO</strong>

                <span class="en-ligne">●</span>

                <p>Bonjour !</p>

            </div>
            <!-- ALEX -->

            <div class="conversation">

                <strong>Alex Tremblay
                </strong>

                <span class="en-ligne">●</span>

                <p>Super !</p>
            </div>

        </div>
        <!-- DISCUSSION -->

        <div class="discussion">
            <!-- NOM DE LA PERSONNE -->

            <div class="entete-discussion">

                <h2>Karol Ihano</h2>

                <span class="en-ligne">● En ligne</span>

            </div>
            <!-- MESSAGES -->

            <div class="messages">

                <div class="message-recu">Salut !</div>

                <div class="message-envoye">Salut !</div>

                <div class="message-recu">Ça va ?</div>

                <div class="message-envoye">Oui ça va bien, et toi ?</div>

                <div class="message-recu">Tu prépares quoi pour la prochaine saison ?</div>

                <div class="message-envoye">Je me prépare pour le gros gibier.</div>

            </div>
            <!-- ÉCRIRE UN MESSAGE -->

            <div class="zone-message">

                <input
                    type="text"
                    placeholder="Écrire un message..."
                >

                <button>Envoyer</button>

            </div>
        </div>
    </div>
</body>
</html>
