<!DOCTYPE html>
<html>

<head>

    <title>Messagerie - GOHUNT</title>

    <style>

        /* PAGE */

        body {
            margin: 0;
            font-family: Arial;

            background-image: url('fond2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }


        /* BARRE DE NAVIGATION */

        .menu {
            background-color: darkgreen;
            padding: 15px;
            text-align: center;
        }

        .logo {
            color: white;
            display: inline;
            margin-right: 80px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            background-color: green;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            display: inline-block;
        }


        /* CONTENU PRINCIPAL */

        .contenu {
            display: flex;
            height: 600px;
            padding: 20px;
        }


        /* COLONNE DES CONVERSATIONS */

        .conversations {
            width: 35%;
            background-color: rgba(255, 255, 255, 0.90);
            padding: 20px;
            border: 1px solid gray;
            border-radius: 10px;
        }

        .recherche {
            width: 90%;
            padding: 10px;
            margin-bottom: 20px;
        }


        /* UNE CONVERSATION */

        .conversation {
            padding: 15px;
            border-bottom: 1px solid lightgray;
        }

        .conversation-active {
            background-color: #d9ead3;
            border-radius: 5px;
        }

        .en-ligne {
            color: green;
        }


        /* COLONNE DE DISCUSSION */

        .discussion {
            width: 65%;
            background-color: rgba(255, 255, 255, 0.90);
            border: 1px solid gray;
            margin-left: 10px;
            border-radius: 10px;
        }


        /* ENTÊTE DE LA DISCUSSION */

        .entete-discussion {
            padding: 20px;
            border-bottom: 1px solid lightgray;
        }

        .entete-discussion h2 {
            margin: 0;
        }


        /* MESSAGES */

        .messages {
            padding: 20px;
            height: 400px;
        }

        .message-recu {
            background-color: #eeeeee;
            padding: 10px;
            margin: 15px;
            width: 40%;
            border-radius: 10px;
        }

        .message-envoye {
            background-color: #d9ead3;
            padding: 10px;
            margin: 15px;
            margin-left: auto;
            width: 40%;
            border-radius: 10px;
        }


        /* ZONE POUR ÉCRIRE UN MESSAGE */

        .zone-message {
            padding: 15px;
            border-top: 1px solid lightgray;
            text-align: center;
        }

        .zone-message input {
            width: 70%;
            padding: 12px;
        }

        .zone-message button {
            padding: 12px 20px;
            background-color: darkgreen;
            color: white;
            border: none;
            border-radius: 5px;
        }

    </style>

</head>


<body>


    <!-- BARRE DE NAVIGATION -->

    <div class="menu">

        <h1 class="logo">
            GOHUNT
        </h1>

        <a href="accueil.html">
            Accueil
        </a>

        <a href="messagerie.html">
            Messagerie
        </a>

        <a href="membres.html">
            Membres
        </a>

        <a href="profil.html">
            Profil
        </a>

    </div>



    <!-- CONTENU PRINCIPAL -->

    <div class="contenu">


        <!-- LISTE DES CONVERSATIONS -->

        <div class="conversations">

            <h2>
                Conversations
            </h2>

            <input
                class="recherche"
                type="text"
                placeholder="Rechercher une conversation"
            >


            <!-- KAROL -->

            <div class="conversation conversation-active">

                <strong>
                    Karol Ihano
                </strong>

                <span class="en-ligne">
                    ●
                </span>

                <p>
                    Ça va ?
                </p>

            </div>


            <!-- MATHIAS -->

            <div class="conversation">

                <strong>
                    Mathias SOKPO
                </strong>

                <span class="en-ligne">
                    ●
                </span>

                <p>
                    Bonjour !
                </p>

            </div>


            <!-- ALEX -->

            <div class="conversation">

                <strong>
                    Alex Tremblay
                </strong>

                <span class="en-ligne">
                    ●
                </span>

                <p>
                    Super !
                </p>

            </div>

        </div>



        <!-- DISCUSSION -->

        <div class="discussion">


            <!-- NOM DE LA PERSONNE -->

            <div class="entete-discussion">

                <h2>
                    Karol Ihano
                </h2>

                <span class="en-ligne">
                    ● En ligne
                </span>

            </div>



            <!-- MESSAGES -->

            <div class="messages">

                <div class="message-recu">
                    Salut !
                </div>

                <div class="message-envoye">
                    Salut !
                </div>

                <div class="message-recu">
                    Ça va ?
                </div>

                <div class="message-envoye">
                    Oui ça va bien, et toi ?
                </div>

                <div class="message-recu">
                    Tu prépares quoi pour la prochaine saison ?
                </div>

                <div class="message-envoye">
                    Je me prépare pour le gros gibier.
                </div>

            </div>



            <!-- ÉCRIRE UN MESSAGE -->

            <div class="zone-message">

                <input
                    type="text"
                    placeholder="Écrire un message..."
                >

                <button>
                    Envoyer
                </button>

            </div>


        </div>

    </div>


</body>

</html>
