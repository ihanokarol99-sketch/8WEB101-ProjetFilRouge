<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <title>Mot de passe oublié - GOHUNT</title>

    <link rel="stylesheet" href="connexion.css">
</head>

<body>

    <div class="connexion">

        <h1>GOHUNT</h1>

        <h2>Mot de passe oublié ?</h2>

        <p>
            Entrez votre adresse courriel pour
            réinitialiser votre mot de passe.
        </p>

        <h4 style="font-family: 'Courier';">
            Adresse courriel
        </h4>

        <input
            type="email"
            id="emailRecuperation"
            placeholder="Votre adresse courriel"
            required
        >

        <br><br>

        <div style="text-align: center;">

            <button
                type="button"
                id="btnRecuperation">
                Continuer
            </button>

        </div>

        <p id="messageRecuperation"></p>

        <br><br>

        <a href="connexion.html">
            Retour à la connexion
        </a>

    </div>

</body>

</html>
