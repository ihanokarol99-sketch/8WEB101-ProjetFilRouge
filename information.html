<!DOCTYPE html>
<html>

<head>
    <title>Informations - GOHUNT</title>

    <style>
        h1 {
            color: green;
            text-align: center;
        }
    </style>
</head>

<body style="background-color:burlywood;">

    <h1>GOHUNT</h1>

    <h2>Parlez-nous un peu de vous !</h2>


    <!-- QUESTION 1 -->

    <h4 style="font-family: 'Courier';">
    Depuis combien d'années chassez-vous ?
    </h4>

<input type = "number"min="0" placeholder="Nombre d'années">

    <!-- QUESTION 2 -->

    <h4 style="font-family: 'Courier';">
        Que chassez-vous ?
    </h4>

    <select>
        <option value="">Choisissez</option>
        <option value="gros">Gros gibier</option>
        <option value="petit">Petit gibier</option>
        <option value="les_deux">Les deux</option>
    </select>


    <!-- QUESTION 3 -->

    <h4 style="font-family: 'Courier';">
    Combien de gibiers avez-vous abattus ?
    </h4>

<input type="text" placeholder="Exemple : 12">

    <!-- QUESTION 4 -->

    <h4 style="font-family: 'Courier';">
        Quelle est votre fréquence de chasse ?
    </h4>

    <select>
        <option value="">Choisissez</option>
        <option value="rarement">Rarement</option>
        <option value="occasionnellement">Occasionnellement</option>
        <option value="regulierement">Régulièrement</option>
        <option value="tres_regulierement">Très régulièrement</option>
    </select>


    <br><br><br>

    <div style="text-align: center;">
        <button onclick="document.location='connexion.html'">
            Continuer
        </button>
    </div>

</body>

</html>
