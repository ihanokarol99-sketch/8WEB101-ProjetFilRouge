<!DOCTYPE html>
<html>

<head>
    <title>Messagerie - GOHUNT</title>

    <link rel="stylesheet" href="../css/messsagerie.css">
</head>

<body> 
    <!-- BARRE DE NAVIGATION -->

    <div class="menu">
        <h1 class="logo">GOHUNT</h1>
        <a href="accueil.html">Accueil</a>
        <a href="messagerie.html">Messagerie</a>
        <a href="membres.html">Membres</a>
        <a href="profil.html">Profil</a>
        
        <button type="button" id="btnDeconnexion" class="btn-deconnexion">
            Déconnexion</button>

    </div>
    <!-- CONTENU PRINCIPAL -->

    <div class="contenu">
        <!-- LISTE DES CONVERSATIONS -->

        <div class="conversations">
            <h2>Conversations</h2>

            <input
                class="recherche"
                type="text"
                placeholder="Rechercher une conversation">
           
            <!-- Liste des conversations chargées automatiquement -->
            <div id="listeConversations"></div>

        </div>
        <!-- DISCUSSION -->

        <div class="discussion">
            <!-- NOM DE LA PERSONNE -->

            <div class="entete-discussion">

                <h2 id="nomDestinataire">Selectionnez une conversation</h2>

                <button id="btnVoirProfil" class="btn-voir-profil" hidden>
                    Voir le profil</button>

                <span class="en-ligne">● En ligne</span>

            </div>
            <!-- MESSAGES -->

            <div class="messages" id="listeMessages">
                 <p>Sélectionnez un destinataire pour afficher les messages.</p>
            </div>
            <!-- ÉCRIRE UN MESSAGE -->

            <div class="zone-message">

                <input type="hidden" id="receiverId"> 
                <input type="text" id="messageInput" placeholder="Écrire un message...">

                <button id="btnEnvoyer" type="button">
                    Envoyer </button>

            </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/messagerie.js"></script>
<script src="../js/messages.js"></script>

</body>
</html>
