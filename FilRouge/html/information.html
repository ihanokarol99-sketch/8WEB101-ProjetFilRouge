<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <title>Informations - GOHUNT</title>

    <link rel="stylesheet" href="../css/commun.css">
</head>

<body>

    <div class="conteneur">
        <h1>GOHUNT</h1>
        <h2>Parlez-nous un peu de vous !</h2>

        <!-- QUESTION 1 -->

        <h4 style="font-family: 'Courier';">
            Depuis combien d'années chassez-vous ?
        </h4>

        <input
            type="number"
            id="anneesExperience"
            min="0"
            placeholder="Nombre d'années"
            required>

        <!-- QUESTION 2 -->

        <h4 style="font-family: 'Courier';">
            Que chassez-vous ?
        </h4>

        <select id="typeChasse" required>

            <option value="">Choisissez</option>

            <option value="gros">
                Gros gibier
            </option>

            <option value="petit">
                Petit gibier
            </option>

            <option value="les_deux">
                Les deux
            </option>

        </select>

        <!-- QUESTION 3 -->

        <h4 style="font-family: 'Courier';">
            Combien de gibiers avez-vous abattus ?
        </h4>

        <input
            type="number"
            id="nombreGibiers"
            min="0"
            placeholder="Exemple : 12"
            required>

            <div id="evaluationChasseur">
            <p>Votre niveau de chasseur :</p>

            <span id="etoilesChasseur">☆☆☆☆☆</span>
            <p id="noteChasseur">0/5 étoiles</p>
            </div>
        
        <!-- QUESTION 4 -->

        <h4 style="font-family: 'Courier';">
            Quelle est votre fréquence de chasse ?
        </h4>

        <select id="frequenceChasse" required>

            <option value="">Choisissez</option>

            <option value="rarement">
                Rarement
            </option>

            <option value="occasionnellement">
                Occasionnellement
            </option>

            <option value="regulierement">
                Régulièrement
            </option>

            <option value="tres_regulierement">
                Très régulièrement
            </option>

        </select>
        <br><br>

        <!-- BOUTON CONTINUER -->

        <div style="text-align: center;">

            <button type="button" id="btnContinuer">
                Continuer
            </button>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/evaluation.js"></script>
<script src="../js/information.js"></script>

</body>

</html>
