<!DOCTYPE html>
<html>

<head>
    <title>Gohunt connexion</title>
    
    <link rel="stylesheet" href="../css/connexion.css">

</head>

<body>
    <h1>GOHUNT</h1>

    <div class="connexion">

        <h4 style="font-family: 'Courier';">
          Nom d'utilisateur ou du courriel
        </h4>

        <input type = "text"
               id="identifiant"
               name="identifiant"
               placeholder="Nom d'utilisateur ou courriel"
               required
               >
        <h4 style="font-family: 'Courier';">
          Mot de passe
        </h4>

        <input type="password" 
               id="motDePasseConnexion"
               name="mot de passe"
               placeholder="Mot de passe"
               required 
               >

    <br><br>

        <div style="text-align: center;">
            <button type="button" id="btnConnexion">
                Connexion
            </button>

            <p id="messageConnexion"></p>
        </div>
    <br>
        <div class="liens">
        <a href="motdepasse.html">Mot de passe oublié ?</a>
        <br>

        <a href="inscription.html">Créer un compte</a>
        </div>
    </div>
</body>

<!-- Bibliothèque Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Connexion à Supabase -->
<script src="../js/supabaseClient.js"></script>

<!-- Gestion de la connexion -->
<script src="../js/connexion.js"></script>


</html>
