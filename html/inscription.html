<!DOCTYPE html>
<html>

<head>
    <title>Inscription - Gohunt</title>
    <link rel="stylesheet" href="../css/commun.css">
</head>

<script src="../js/inscription.js" defer></script>
<body>
    <div class="conteneur">

        <h1>GOHUNT</h1>

        <h2>Inscription</h2>

        <h4 style="font-family: 'Courier';">Prénom</h4>
        <input type="text" id="prenomInscription" placeholder="Votre prénom">

        <h4 style="font-family: 'Courier';">Nom</h4>
        <input type="text" id="nomInscription" placeholder="Votre nom">

        <h4 style="font-family: 'Courier';">Adresse courriel</h4>
        <input type="email" id="AdresseInscription" placeholder="Votre adresse courriel">

        <h4 style="font-family: 'Courier';">Nom d'utilisateur</h4>
        <input type="text" id="courrielInscription" placeholder="Choisissez un nom d'utilisateur">

        <h4 style="font-family: 'Courier';">Mot de passe</h4>
        <input type="password" id="passwordInscription" placeholder="Choisissez un mot de passe">
        
        <h4 style="font-family: 'Courier';">Confirmer le mot de passe</h4>
        <input type="password" id="passInscription" placeholder="Confirmez votre mot de passe">

        <br><br>

        <div style="text-align: center;">
            <button type="button" id="boutonInscription">Inscription</button>
        </div>

        <br><br>

        Déjà un compte ?
        <a href="connexion.html">Se connecter</a>
    </div>    
</body>
</html>
