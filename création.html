<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <title>Inscription - Gohunt</title>

    <link rel="stylesheet" href="creation.css">
</head>

<body>

    <h1>GOHUNT</h1>

    <div class="creation">

        <h2>Créer un compte</h2>

        <h4 style="font-family: 'Courier';">
            Prénom
        </h4>

        <input
            type="text"
            id="prenom"
            placeholder="Votre prénom"
            required
        >

        <h4 style="font-family: 'Courier';">
            Nom
        </h4>

        <input
            type="text"
            id="nom"
            placeholder="Votre nom"
            required
        >

        <h4 style="font-family: 'Courier';">
            Adresse courriel
        </h4>

        <input
            type="email"
            id="email"
            placeholder="Votre adresse courriel"
            required
        >

        <h4 style="font-family: 'Courier';">
            Nom d'utilisateur
        </h4>

        <input
            type="text"
            id="nomUtilisateur"
            placeholder="Choisissez un nom d'utilisateur"
            required
        >

        <h4 style="font-family: 'Courier';">
            Mot de passe
        </h4>

        <input
            type="password"
            id="motdepasseInscription"
            placeholder="Choisissez un mot de passe"
            required
        >

        <h4 style="font-family: 'Courier';">
            Confirmer le mot de passe
        </h4>

        <input
            type="password"
            id="confirmationMotdepasse"
            placeholder="Confirmez le mot de passe"
            required
        >

        <br><br>

        <div style="text-align: center;">

    <button
        type="button"
        id="btnInscription"
        onclick="document.location='information.html'">
        Inscription
    </button>

</div>

        <br><br>

        <p>
            Déjà un compte ?
            <a href="connexion.html">Se connecter</a>
        </p>

    </div>

</body>

</html>
